name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    # Run once a month: 1st of every month at midnight UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Create Python venv and install deps
        run: |
          uv venv .venv --python 3.12
          uv pip install -r scripts/requirements.txt --python .venv/bin/python

      - name: Sync content from YAML configs
        run: uv run --python .venv/bin/python scripts/sync-content.py

      - name: Sync research papers from GitHub
        run: uv run --python .venv/bin/python scripts/sync-research.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync projects from GitHub
        run: uv run --python .venv/bin/python scripts/sync-projects.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
