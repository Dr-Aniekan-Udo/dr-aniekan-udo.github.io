<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#141414"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle geometric grid -->
  <g stroke="#262626" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="112.5" x2="800" y2="112.5"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="337.5" x2="800" y2="337.5"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>
  
  <!-- Code bracket motifs -->
  <g fill="none" stroke="#262626" stroke-width="2" opacity="0.6">
    <!-- Left bracket -->
    <path d="M 320 180 L 300 180 L 300 270 L 320 270"/>
    <!-- Right bracket -->
    <path d="M 480 180 L 500 180 L 500 270 L 480 270"/>
  </g>
  
  <!-- Accent gradient bars -->
  <rect x="0" y="200" width="800" height="2" fill="url(#accent)" opacity="0.6"/>
  <rect x="0" y="248" width="800" height="1" fill="url(#accent)" opacity="0.3"/>
  
  <!-- Text -->
  <text x="400" y="235" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="600" fill="#e5e5e5" letter-spacing="0.05em">
    Aniekan Udo
  </text>
  <text x="400" y="265" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" font-weight="400" fill="#737373" letter-spacing="0.15em">
    DATA · AI · FULLSTACK · MLOPS · AUTOMATION
  </text>
  
  <!-- Small amber accent dot -->
  <circle cx="400" cy="290" r="3" fill="#f59e0b" opacity="0.8"/>
</svg>
